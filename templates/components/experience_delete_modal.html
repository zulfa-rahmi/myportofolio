{# Satu dialog konfirmasi yang dipakai bersama semua kartu; diisi oleh experience.js #}
<dialog id="delete-experience-modal" class="project-delete-modal">
    <div class="project-delete-modal__backdrop" data-close-delete></div>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                data-close-delete
                aria-label="Tutup">&times;</button>
        <h2>Hapus Pengalaman</h2>
        <p>Apakah Anda yakin ingin menghapus pengalaman <strong>"<span id="delete-experience-title"></span>"</strong>? Tindakan ini tidak dapat dibatalkan.</p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-secondary" data-close-delete>Batal</button>
            <form id="delete-experience-form" method="post" action="">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</dialog>
