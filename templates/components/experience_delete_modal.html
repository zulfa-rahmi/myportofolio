<button type="button"
        class="button button-danger"
        onclick="document.getElementById('delete-modal-{{ experience.id }}').showModal()">
    Hapus
</button>

<dialog id="delete-modal-{{ experience.id }}" class="project-delete-modal">
    <div class="project-delete-modal__backdrop" onclick="document.getElementById('delete-modal-{{ experience.id }}').close()"></div>
    <div class="project-delete-modal__content">
        <button type="button" 
                class="project-delete-modal__close" 
                onclick="document.getElementById('delete-modal-{{ experience.id }}').close()"
                aria-label="Tutup">
            &times;
        </button>
        <h2>Hapus Pengalaman</h2>
        <p>Apakah Anda yakin ingin menghapus pengalaman <strong>"{{ experience.title }}"</strong>? Tindakan ini tidak dapat dibatalkan.</p>
        <div class="project-delete-modal__actions">
            <button type="button" 
                    class="button button-secondary" 
                    onclick="document.getElementById('delete-modal-{{ experience.id }}').close()">
                Batal
            </button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</dialog>
